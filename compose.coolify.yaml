# Coolify deployment - API, web app, and learner app (staging).
#
# Routing: traffic enters via Cloudflare Tunnel -> Coolify's Traefik proxy ->
# this container on the shared Coolify network. Services may use the same
# internal container ports as other Coolify resources; they are routed by
# service/domain, not by globally unique container ports. Avoid hand-written
# generic Traefik service labels such as `api`, `web`, or `website` because
# those names are provider-wide and can collide with other Coolify apps.
# Coolify generates isolated router/service labels from SERVICE_FQDN_* vars.
#
# Required env vars (set in Coolify -> Resource -> Environment Variables):
#   POSTGRES_HOST, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD,
#   JWT_SECRET_KEY, ENCRYPTION_KEY,
#   AUTH_SECRET or NEXTAUTH_SECRET, WEB_PUBLIC_URL, LEARNING_PUBLIC_URL
#
# Recommended env vars:
#   JWT_ISSUER, JWT_AUDIENCE,
#   SERVICE_FQDN_API, SERVICE_FQDN_WEB, SERVICE_FQDN_LEARNING,
#   API_INTERNAL_URL, API_PUBLIC_URL
#
# Compatibility:
#   Older Coolify resources may still expose the public web app domain through
#   SERVICE_FQDN_WEBSITE or SERVICE_FQDN_WEBSITE_3000. The web service maps
#   those names into SERVICE_FQDN_WEB_3000 so the existing
#   game-guild-website.* domain keeps routing after the service rename.
#
# In the Coolify UI, set the service "Port Exposed" to 8080 so Traefik
# targets the API port configured below.

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: game-guild-api
    ports:
      - '8080'
    environment:
      - SERVICE_FQDN_API_8080=${SERVICE_FQDN_API_8080:-${SERVICE_FQDN_API:-}}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Staging}
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - DATAPROTECTION_KEYS_PATH=/app/.aspnet/DataProtection-Keys
      - SeedData__ImportSnapshotCourses=${SEED_SNAPSHOT_COURSES:-true}
      # Shared Coolify Postgres
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST:?set POSTGRES_HOST};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:?set POSTGRES_DB};Username=${POSTGRES_USER:?set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD};Include Error Detail=false;Maximum Pool Size=100;Minimum Pool Size=5;Connection Idle Lifetime=300
      - ConnectionStrings__AuthenticationDb=Host=${POSTGRES_HOST:?set POSTGRES_HOST};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:?set POSTGRES_DB};Username=${POSTGRES_USER:?set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD};Include Error Detail=false;Maximum Pool Size=100;Minimum Pool Size=5;Connection Idle Lifetime=300
      # JWT configuration consumed by the API and auth services
      - Jwt__SecretKey=${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-GameGuild}
      - Jwt__Audience=${JWT_AUDIENCE:-GameGuild.Users}
      - Authentication__JwtSecretKey=${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      - Authentication__JwtIssuer=${JWT_ISSUER:-GameGuild}
      - Authentication__JwtAudience=${JWT_AUDIENCE:-GameGuild.Users}
      - Authentication__JwtExpiration=${JWT_EXPIRATION:-24:00:00}
      - Encryption__Key=${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      - Encryption__EncryptionKey=${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
    volumes:
      - dataprotection-keys-v2:/app/.aspnet/DataProtection-Keys
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/live || exit 1']
      start_interval: 5s
      start_period: 180s
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    labels:
      - 'com.game-guild.app=api'
      - 'com.game-guild.tier=backend'
      - 'com.game-guild.environment=staging'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - default
      - coolify

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        GIT_HASH: ${GIT_HASH:-}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-${AUTH_SECRET:?set AUTH_SECRET or NEXTAUTH_SECRET}}
        AUTH_SECRET: ${AUTH_SECRET:-${NEXTAUTH_SECRET:?set AUTH_SECRET or NEXTAUTH_SECRET}}
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8080}
        API_PUBLIC_URL: ${API_PUBLIC_URL:-}
        WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-${SERVICE_FQDN_WEB_3000:-${SERVICE_FQDN_WEB:-${SERVICE_FQDN_WEBSITE_3000:-${SERVICE_FQDN_WEBSITE:-}}}}}
        LEARNING_PUBLIC_URL: ${LEARNING_PUBLIC_URL:-}
    image: game-guild-web
    ports:
      - '3000'
    environment:
      - SERVICE_FQDN_WEB_3000=${SERVICE_FQDN_WEB_3000:-${SERVICE_FQDN_WEB:-${SERVICE_FQDN_WEBSITE_3000:-${SERVICE_FQDN_WEBSITE:-}}}}
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - API_URL=${API_INTERNAL_URL:-http://api:8080}
      - NEXT_PUBLIC_API_URL=${API_PUBLIC_URL:-}
      - NEXT_PUBLIC_APP_URL=${WEB_PUBLIC_URL:-${SERVICE_FQDN_WEB_3000:-${SERVICE_FQDN_WEB:-${SERVICE_FQDN_WEBSITE_3000:-${SERVICE_FQDN_WEBSITE:-}}}}}
      - NEXT_PUBLIC_LEARNING_APP_URL=${LEARNING_PUBLIC_URL:-}
      - NEXTAUTH_URL=${WEB_PUBLIC_URL:-${SERVICE_FQDN_WEB_3000:-${SERVICE_FQDN_WEB:-${SERVICE_FQDN_WEBSITE_3000:-${SERVICE_FQDN_WEBSITE:-}}}}}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-${AUTH_SECRET:?set AUTH_SECRET or NEXTAUTH_SECRET}}
      - AUTH_SECRET=${AUTH_SECRET:-${NEXTAUTH_SECRET:?set AUTH_SECRET or NEXTAUTH_SECRET}}
      - AUTH_TRUST_HOST=true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\"",
        ]
      start_interval: 10s
      start_period: 90s
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    labels:
      - 'com.game-guild.app=web'
      - 'com.game-guild.tier=frontend'
      - 'com.game-guild.environment=staging'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - default
      - coolify
    depends_on:
      api:
        condition: service_started

  learning:
    build:
      context: .
      dockerfile: apps/learning/Dockerfile
      args:
        GIT_HASH: ${GIT_HASH:-}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-${AUTH_SECRET:?set AUTH_SECRET or NEXTAUTH_SECRET}}
        AUTH_SECRET: ${AUTH_SECRET:-${NEXTAUTH_SECRET:?set AUTH_SECRET or NEXTAUTH_SECRET}}
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8080}
        API_PUBLIC_URL: ${API_PUBLIC_URL:-}
        LEARNING_PUBLIC_URL: ${LEARNING_PUBLIC_URL:-}
        WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-}
    image: game-guild-learning
    ports:
      - '3002'
    environment:
      - SERVICE_FQDN_LEARNING_3002=${SERVICE_FQDN_LEARNING_3002:-${SERVICE_FQDN_LEARNING:-}}
      - NODE_ENV=production
      - PORT=3002
      - HOSTNAME=0.0.0.0
      - API_URL=${API_INTERNAL_URL:-http://api:8080}
      - NEXT_PUBLIC_API_URL=${API_PUBLIC_URL:-}
      - NEXTAUTH_URL=${LEARNING_PUBLIC_URL:-}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-${AUTH_SECRET:?set AUTH_SECRET or NEXTAUTH_SECRET}}
      - AUTH_SECRET=${AUTH_SECRET:-${NEXTAUTH_SECRET:?set AUTH_SECRET or NEXTAUTH_SECRET}}
      - AUTH_TRUST_HOST=true
      - NEXT_PUBLIC_WEB_URL=${WEB_PUBLIC_URL:-}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3002/sign-in').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\"",
        ]
      start_interval: 10s
      start_period: 90s
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    labels:
      - 'com.game-guild.app=learning'
      - 'com.game-guild.tier=frontend'
      - 'com.game-guild.environment=staging'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - default
      - coolify
    depends_on:
      api:
        condition: service_started

networks:
  coolify:
    external: true

volumes:
  dataprotection-keys-v2:
    driver: local
