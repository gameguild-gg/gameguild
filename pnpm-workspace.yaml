packages:
  # Applications
  - "apps/*"

  # Domain features
  - "packages/features/*"

  # Framework / runtime infrastructure
  - "packages/ui"
  - "packages/infrastructure/*"
  - "packages/infrastructure/wasm/*"

  # Tooling (build/dev configs)
  - "packages/tooling/*"

  # Tools & demos
  - "tools/*"
  - "tools/emception/packages/*"
  - "demos/*"

onlyBuiltDependencies:
  - braces
  - deepmerge
  - eslint-plugin-import
  - glob
  - minimatch
  - sprintf-js

