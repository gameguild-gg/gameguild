# CI workflow for the Browser C/C++ Toolchain (Emception)
#
# Builds the complete WASM toolchain: Binaryen, CPython, LLVM, sysroot, and CDN bundles.
# Uses TypeScript build scripts (via npm) in tools/emception/scripts/.
#
# Build order: emsdk → binaryen → cpython → (optional: llvm) → sysroot → manifest → bundles

name: Browser Toolchain

on:
  push:
    branches: [main]
    # paths:
    #   - 'tools/emception/**'
  pull_request:
    paths:
      - 'tools/emception/**'
  workflow_dispatch:
    inputs:
      build_llvm:
        description: 'Build LLVM tools (clang, lld) — takes ~2h'
        type: boolean
        default: false

jobs:
  build:
    name: Build WASM Toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: tools/emception
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Pre-install Emscripten SDK
        run: |
          # Pre-create emsdk so setupEmsdk() finds it and can capture env vars
          mkdir -p tools/emsdk
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git tools/emsdk
          cd tools/emsdk
          ./emsdk install latest
          ./emsdk activate latest
          
      - name: Build Binaryen
        run: |
          source tools/emsdk/emsdk_env.sh
          npm run build:binaryen

      - name: Build CPython
        run: |
          source tools/emsdk/emsdk_env.sh
          npm run build:cpython

      - name: Build LLVM (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_llvm }}
        run: |
          source tools/emsdk/emsdk_env.sh
          npm run build:llvm

      - name: Populate sysroot
        run: |
          source tools/emsdk/emsdk_env.sh
          npm run build:sysroot

      - name: Generate manifest
        run: |
          source tools/emsdk/emsdk_env.sh
          npm run build:manifest

      - name: Generate bundles
        run: |
          source tools/emsdk/emsdk_env.sh
          npm run build:bundles

      - uses: actions/upload-artifact@v4
        with:
          name: emception-cdn
          path: |
            tools/emception/public/cdn/
            tools/emception/build/manifest.json
          retention-days: 30
