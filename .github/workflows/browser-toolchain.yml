# CI workflow for the Browser C/C++ Toolchain
#
# Builds the WASM modules using Emscripten dynamic linking:
#   - MAIN_MODULE runtime (libc, libc++, dlopen, filesystem)
#   - libbinaryen.so.wasm + binaryen tool SIDE_MODULEs
#   - cpython.wasm
#   - libLLVM.so.wasm + clang/lld SIDE_MODULEs (optional, ~2-4h)
#
# Then packages everything for CDN deployment.

name: Browser Toolchain

on:
  push:
    branches: [main]
    paths:
      - 'tools/clang/**'
  pull_request:
    paths:
      - 'tools/clang/**'
  workflow_dispatch:
    inputs:
      build_llvm:
        description: 'Build libLLVM + clang + lld (takes ~2h)'
        type: boolean
        default: false
      build_binaryen:
        description: 'Build libbinaryen + tools'
        type: boolean
        default: true
      build_cpython:
        description: 'Build cpython'
        type: boolean
        default: true
      emsdk_version:
        description: 'Emscripten SDK version'
        type: string
        default: 'latest'

env:
  EMSDK_VERSION: ${{ inputs.emsdk_version || 'latest' }}

jobs:
  orchestrator:
    name: Build Orchestrator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/clang
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/clang/package-lock.json

      - run: npm ci || npm install
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: orchestrator-dist
          path: tools/clang/dist/
          retention-days: 7

  runtime:
    name: Build MAIN_MODULE Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Build runtime
        working-directory: tools/clang/userland/runtime
        run: bash build-runtime.sh

      - uses: actions/upload-artifact@v4
        with:
          name: runtime
          path: |
            tools/clang/build/runtime.mjs
            tools/clang/build/runtime.wasm
          retention-days: 30

  binaryen:
    name: Build libbinaryen + tools
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_binaryen }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Cache binaryen source
        uses: actions/cache@v4
        with:
          path: tools/clang/userland/binaryen/binaryen-*
          key: binaryen-src-126

      - name: Build libbinaryen.so.wasm
        working-directory: tools/clang/userland/binaryen
        run: bash build-libbinaryen.sh

      - name: Build binaryen tool modules
        working-directory: tools/clang/userland/binaryen
        run: bash build-tools.sh

      - uses: actions/upload-artifact@v4
        with:
          name: binaryen
          path: |
            tools/clang/build/libbinaryen.so.wasm
            tools/clang/build/wasm-opt.so.wasm
            tools/clang/build/wasm-as.so.wasm
            tools/clang/build/wasm-ctor-eval.so.wasm
            tools/clang/build/wasm-emscripten-finalize.so.wasm
            tools/clang/build/wasm-metadce.so.wasm
          retention-days: 30

  cpython:
    name: Build CPython
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_cpython }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Cache CPython source
        uses: actions/cache@v4
        with:
          path: tools/clang/userland/cpython/cpython-*
          key: cpython-src-3.14.3

      - name: Build CPython
        working-directory: tools/clang/userland/cpython
        run: bash build-cpython.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cpython-wasm
          path: |
            tools/clang/build/cpython.*
            tools/clang/build/cdn/python3.14-stdlib.zip
          retention-days: 30

  llvm:
    name: Build libLLVM + clang + lld
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_llvm }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Cache LLVM source
        uses: actions/cache@v4
        with:
          path: tools/clang/userland/llvm/llvm-project-*
          key: llvm-src-22.1.0

      - name: Build libLLVM.so.wasm
        working-directory: tools/clang/userland/llvm
        run: bash build-libllvm.sh

      - name: Build clang.so.wasm
        working-directory: tools/clang/userland/llvm
        run: bash build-clang.sh

      - name: Build lld.so.wasm
        working-directory: tools/clang/userland/llvm
        run: bash build-lld.sh

      - uses: actions/upload-artifact@v4
        with:
          name: llvm
          path: |
            tools/clang/build/libLLVM.so.wasm
            tools/clang/build/clang.so.wasm
            tools/clang/build/lld.so.wasm
          retention-days: 30

  package:
    name: Package for CDN
    needs: [orchestrator, runtime, binaryen, cpython]
    if: always() && needs.orchestrator.result == 'success' && needs.runtime.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/clang
    steps:
      - uses: actions/checkout@v4

      - name: Download orchestrator
        uses: actions/download-artifact@v4
        with:
          name: orchestrator-dist
          path: tools/clang/dist/

      - name: Download runtime
        uses: actions/download-artifact@v4
        with:
          name: runtime
          path: tools/clang/build/

      - name: Download binaryen
        uses: actions/download-artifact@v4
        with:
          name: binaryen
          path: tools/clang/build/
        continue-on-error: true

      - name: Download cpython
        uses: actions/download-artifact@v4
        with:
          name: cpython-wasm
          path: tools/clang/build/
        continue-on-error: true

      - name: Download LLVM
        uses: actions/download-artifact@v4
        with:
          name: llvm
          path: tools/clang/build/
        continue-on-error: true

      - name: Setup Emscripten (for sysroot)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Copy build artifacts to sysroot
        run: |
          mkdir -p sysroot/usr/lib
          cp -f build/*.wasm sysroot/usr/lib/ 2>/dev/null || true
          cp -f build/*.mjs sysroot/usr/lib/ 2>/dev/null || true

      - name: Populate sysroot
        run: bash scripts/populate-sysroot.sh

      - name: Install brotli
        run: sudo apt-get install -y brotli

      - name: Generate manifest
        run: bash scripts/generate-manifest.sh

      - name: Compress for CDN
        run: bash scripts/compress-cdn.sh

      - uses: actions/upload-artifact@v4
        with:
          name: browser-toolchain-cdn
          path: |
            tools/clang/build/
            tools/clang/dist/
            tools/clang/web/
          retention-days: 30
