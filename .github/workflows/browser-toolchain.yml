# CI workflow for the Browser C/C++ Toolchain (Emception)
#
# Micro-kernel architecture: each tool is a standalone WASM process.
# Build pipeline uses TypeScript scripts (tsx) in tools/emception/scripts/.
#
# Build order: emsdk → binaryen → cpython → llvm → sysroot → patch → manifest → bundles → cdn
#
# Each tool job produces standalone .wasm + .mjs pairs (no MAIN_MODULE/SIDE_MODULE).

name: Browser Toolchain

on:
  push:
    branches: [main]
    paths:
      - 'tools/emception/**'
  pull_request:
    paths:
      - 'tools/emception/**'
  workflow_dispatch:
    inputs:
      build_llvm:
        description: 'Build LLVM tools (clang, lld, llvm-ar, etc.) — takes ~2h'
        type: boolean
        default: false
      build_binaryen:
        description: 'Build Binaryen tools (wasm-opt, wasm-as, etc.)'
        type: boolean
        default: true
      build_cpython:
        description: 'Build CPython (for emcc/em++ driver)'
        type: boolean
        default: true
      emsdk_version:
        description: 'Emscripten SDK version'
        type: string
        default: 'latest'

env:
  EMSDK_VERSION: ${{ inputs.emsdk_version || 'latest' }}

jobs:
  # -------------------------------------------------------------------
  # Typecheck — fast gate before expensive builds
  # -------------------------------------------------------------------
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/emception
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/emception/package-lock.json

      - run: npm ci || npm install
      - run: npm run typecheck

  # -------------------------------------------------------------------
  # Emsdk setup — shared by all build jobs via cache
  # -------------------------------------------------------------------
  emsdk:
    name: Setup Emsdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/emception/package-lock.json

      - name: Install dependencies
        working-directory: tools/emception
        run: npm ci || npm install

      - name: Setup Emscripten SDK
        working-directory: tools/emception
        run: npm run build:emsdk

      - name: Cache emsdk
        uses: actions/cache/save@v4
        with:
          path: tools/emception/userland/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}-${{ hashFiles('tools/emception/scripts/setup-emsdk.ts') }}

  # -------------------------------------------------------------------
  # Binaryen — standalone WASM tools (wasm-opt, wasm-as, etc.)
  # -------------------------------------------------------------------
  binaryen:
    name: Build Binaryen Tools
    needs: [typecheck, emsdk]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_binaryen }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/emception
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/emception/package-lock.json

      - run: npm ci || npm install

      - name: Restore emsdk cache
        uses: actions/cache/restore@v4
        with:
          path: tools/emception/userland/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}-${{ hashFiles('tools/emception/scripts/setup-emsdk.ts') }}

      - name: Setup emsdk environment
        run: npm run build:emsdk

      - name: Cache Binaryen source
        uses: actions/cache@v4
        with:
          path: tools/emception/userland/binaryen
          key: binaryen-src-${{ hashFiles('tools/emception/scripts/build-binaryen.ts') }}

      - name: Build Binaryen
        run: npm run build:binaryen

      - uses: actions/upload-artifact@v4
        with:
          name: binaryen
          path: |
            tools/emception/build/wasm-opt.wasm
            tools/emception/build/wasm-opt.mjs
            tools/emception/build/wasm-as.wasm
            tools/emception/build/wasm-as.mjs
            tools/emception/build/wasm-ctor-eval.wasm
            tools/emception/build/wasm-ctor-eval.mjs
            tools/emception/build/wasm-emscripten-finalize.wasm
            tools/emception/build/wasm-emscripten-finalize.mjs
            tools/emception/build/wasm-metadce.wasm
            tools/emception/build/wasm-metadce.mjs
          retention-days: 30

  # -------------------------------------------------------------------
  # CPython — standalone WASM (emcc/em++ driver)
  # -------------------------------------------------------------------
  cpython:
    name: Build CPython
    needs: [typecheck, emsdk]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_cpython }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tools/emception
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/emception/package-lock.json

      - run: npm ci || npm install

      - name: Restore emsdk cache
        uses: actions/cache/restore@v4
        with:
          path: tools/emception/userland/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}-${{ hashFiles('tools/emception/scripts/setup-emsdk.ts') }}

      - name: Setup emsdk environment
        run: npm run build:emsdk

      - name: Cache CPython source
        uses: actions/cache@v4
        with:
          path: tools/emception/userland/cpython
          key: cpython-src-${{ hashFiles('tools/emception/scripts/build-cpython.ts') }}

      - name: Build CPython
        run: npm run build:cpython

      - uses: actions/upload-artifact@v4
        with:
          name: cpython
          path: |
            tools/emception/build/python.wasm
            tools/emception/build/python.mjs
          retention-days: 30

  # -------------------------------------------------------------------
  # LLVM — standalone WASM tools (clang, lld, llvm-ar, llvm-nm, etc.)
  # -------------------------------------------------------------------
  llvm:
    name: Build LLVM Tools
    needs: [typecheck, emsdk]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_llvm }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: tools/emception
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/emception/package-lock.json

      - run: npm ci || npm install

      - name: Restore emsdk cache
        uses: actions/cache/restore@v4
        with:
          path: tools/emception/userland/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}-${{ hashFiles('tools/emception/scripts/setup-emsdk.ts') }}

      - name: Setup emsdk environment
        run: npm run build:emsdk

      - name: Cache LLVM source
        uses: actions/cache@v4
        with:
          path: tools/emception/userland/llvm
          key: llvm-src-${{ hashFiles('tools/emception/scripts/build-llvm.ts') }}

      - name: Build LLVM
        run: npm run build:llvm

      - uses: actions/upload-artifact@v4
        with:
          name: llvm
          path: |
            tools/emception/build/clang.wasm
            tools/emception/build/clang.mjs
            tools/emception/build/lld.wasm
            tools/emception/build/lld.mjs
            tools/emception/build/llvm-nm.wasm
            tools/emception/build/llvm-nm.mjs
            tools/emception/build/llvm-ar.wasm
            tools/emception/build/llvm-ar.mjs
            tools/emception/build/llvm-objcopy.wasm
            tools/emception/build/llvm-objcopy.mjs
            tools/emception/build/llc.wasm
            tools/emception/build/llc.mjs
          retention-days: 30

  # -------------------------------------------------------------------
  # Package — assemble sysroot, patch glue, generate manifest/bundles,
  #            deploy to CDN directory, build Next.js web app
  # -------------------------------------------------------------------
  package:
    name: Package & Build Web
    needs: [typecheck, emsdk, binaryen, cpython]
    if: always() && needs.typecheck.result == 'success' && needs.emsdk.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/emception
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/emception/package-lock.json

      - run: npm ci || npm install

      - name: Restore emsdk cache
        uses: actions/cache/restore@v4
        with:
          path: tools/emception/userland/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}-${{ hashFiles('tools/emception/scripts/setup-emsdk.ts') }}

      - name: Setup emsdk environment
        run: npm run build:emsdk

      - name: Download Binaryen artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaryen
          path: tools/emception/build/
        continue-on-error: true

      - name: Download CPython artifacts
        uses: actions/download-artifact@v4
        with:
          name: cpython
          path: tools/emception/build/
        continue-on-error: true

      - name: Download LLVM artifacts
        uses: actions/download-artifact@v4
        with:
          name: llvm
          path: tools/emception/build/
        continue-on-error: true

      - name: Copy build artifacts to sysroot
        run: |
          mkdir -p sysroot/usr/lib
          cp -f build/*.wasm sysroot/usr/lib/ 2>/dev/null || true
          cp -f build/*.mjs sysroot/usr/lib/ 2>/dev/null || true

      - name: Populate sysroot
        run: npm run build:sysroot

      - name: Patch glue files
        run: npm run patch:glue

      - name: Generate manifest
        run: npm run build:manifest

      - name: Generate bundles
        run: npm run build:bundles

      - name: Deploy to CDN directory
        run: npm run deploy:cdn

      - name: Build Next.js web app
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: browser-toolchain-cdn
          path: |
            tools/emception/build/
            tools/emception/.next/
          retention-days: 30
