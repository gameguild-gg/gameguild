name: pr-agent
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize] 
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent:
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name == 'pull_request' ||
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      # pr-agent v0.48.0, verified against the publisher's release attestation.
      - uses: docker://pragent/pr-agent@sha256:80edef71baa3df28c129d858d4b53784abfc14704c235efb32b6c461d5399a6d
        env:
          ARTIFACT_PATH: ""
          ARTIFACT_INSTRUCTIONS: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OMNI_API_KEY }}
          OPENAI__API_BASE: https://omniroute.gameguild.gg/v1
          CONFIG__MODEL: openai/omo/primary
          CONFIG__FALLBACK_MODELS: '["openai/omo/primary"]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "900000"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "true"