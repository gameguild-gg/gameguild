name: Main CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: Detect path changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
            api:
              - 'apps/api/**'

  build-emception-toolchain:
    name: Build tools/emception
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      toolchain-changed: ${{ steps.cache-toolchain.outputs.cache-hit != 'true' }}
    env:
      EMSDK_VERSION: latest
    defaults:
      run:
        working-directory: tools/emception
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Resolve EMSDK version
        id: emsdk-version
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          RAW_VERSION="${{ env.EMSDK_VERSION }}"
          if [[ "${RAW_VERSION}" == "latest" || -z "${RAW_VERSION}" ]]; then
            TAGS_JSON=$(curl -sf https://raw.githubusercontent.com/emscripten-core/emsdk/main/emscripten-releases-tags.json)
            RESOLVED=$(echo "${TAGS_JSON}" | python3 -c "import sys,json; print(json.load(sys.stdin)['aliases']['latest'])")
            echo "Resolved emsdk 'latest' → ${RESOLVED}"
          else
            RESOLVED="${RAW_VERSION}"
            echo "Using explicit emsdk version: ${RESOLVED}"
          fi
          echo "resolved=${RESOLVED}" >> "$GITHUB_OUTPUT"

      - name: Restore EMSDK cache
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: tools/emception/tools/emsdk
          key: ${{ runner.os }}-emception-emsdk-v2-${{ steps.emsdk-version.outputs.resolved }}-${{ hashFiles('tools/emception/scripts/setup-emsdk.ts', 'tools/emception/scripts/lib/emsdk.ts') }}
          restore-keys: |
            ${{ runner.os }}-emception-emsdk-v2-${{ steps.emsdk-version.outputs.resolved }}-

      - name: Install native build tools
        run: |
          if command -v sudo >/dev/null 2>&1; then
            SUDO=sudo
          else
            SUDO=""
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y cmake ninja-build build-essential pkg-config brotli

      - name: Typecheck
        run: npm run typecheck

      - name: Build Emsdk
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: npm run build:emsdk

      - name: Detect tool versions for cache keys
        id: tool-versions
        run: |
          set -euo pipefail

          EMSDK_DIR="${GITHUB_WORKSPACE}/tools/emception/tools/emsdk"
          CLANG_BIN="${EMSDK_DIR}/upstream/bin/clang"
          WASMOPT_BIN="${EMSDK_DIR}/upstream/bin/wasm-opt"

          if [[ ! -x "${CLANG_BIN}" || ! -x "${WASMOPT_BIN}" ]]; then
            echo "::error::Required emsdk binaries were not found. Expected ${CLANG_BIN} and ${WASMOPT_BIN}."
            exit 1
          fi

          CLANG_VERSION_OUT="$(${CLANG_BIN} --version 2>&1 | cat)"
          LLVM_VERSION="$(echo "${CLANG_VERSION_OUT}" | sed -nE 's/.*clang version ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -1)"
          LLVM_COMMIT="$(echo "${CLANG_VERSION_OUT}" | grep -Eo 'llvm-project [0-9a-f]{40}' | awk '{print $2}' | head -1)"
          BINARYEN_VERSION="$(${WASMOPT_BIN} --version 2>&1 | sed -nE 's/.*version ([0-9]+).*/\1/p' | head -1)"

          PYTHON_BIN=""
          if [[ -d "${EMSDK_DIR}/python" ]]; then
            PYTHON_BIN="$(find "${EMSDK_DIR}/python" -type f \( -name python3 -o -name python \) | head -1 || true)"
          fi

          if [[ -n "${PYTHON_BIN}" ]]; then
            PYTHON_VERSION="$(${PYTHON_BIN} --version 2>&1 | sed -nE 's/Python ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -1)"
          else
            PYTHON_VERSION="$(python3 --version 2>&1 | sed -nE 's/Python ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -1)"
          fi

          echo "llvm_version=${LLVM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "llvm_commit=${LLVM_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "binaryen_version=${BINARYEN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "python_version=${PYTHON_VERSION}" >> "$GITHUB_OUTPUT"

          # Also read the emscripten version (stored in emsdk after install)
          EMSCRIPTEN_VERSION_FILE="${EMSDK_DIR}/upstream/emscripten/emscripten-version.txt"
          if [[ -f "${EMSCRIPTEN_VERSION_FILE}" ]]; then
            EMSCRIPTEN_VERSION="$(tr -d '"' < "${EMSCRIPTEN_VERSION_FILE}" | tr -d '[:space:]')"
          else
            EMSCRIPTEN_VERSION="${{ steps.emsdk-version.outputs.resolved }}"
          fi
          echo "emscripten_version=${EMSCRIPTEN_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Detected versions for cache key:"
          echo "  Emscripten:   ${EMSCRIPTEN_VERSION}"
          echo "  LLVM version: ${LLVM_VERSION}"
          echo "  LLVM commit:  ${LLVM_COMMIT}"
          echo "  Binaryen:     ${BINARYEN_VERSION}"
          echo "  Python:       ${PYTHON_VERSION}"

      - name: Restore emception toolchain output cache
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            tools/emception/build/cdn
            tools/emception/build/manifest.json
            tools/emception/public/cdn
          key: ${{ runner.os }}-emception-toolchain-v4-emsdk-${{ steps.tool-versions.outputs.emscripten_version }}-llvm-${{ steps.tool-versions.outputs.llvm_version }}-${{ steps.tool-versions.outputs.llvm_commit }}-byn-${{ steps.tool-versions.outputs.binaryen_version }}-py-${{ steps.tool-versions.outputs.python_version }}-${{ hashFiles('tools/emception/scripts/**/*.ts', 'tools/emception/package.json', 'tools/emception/userland/libcurl-lite/src/curl_lite.c', 'tools/emception/userland/libcurl-lite/include/curl/curl.h') }}
          restore-keys: |
            ${{ runner.os }}-emception-toolchain-v4-emsdk-${{ steps.tool-versions.outputs.emscripten_version }}-llvm-${{ steps.tool-versions.outputs.llvm_version }}-${{ steps.tool-versions.outputs.llvm_commit }}-
            ${{ runner.os }}-emception-toolchain-v4-emsdk-${{ steps.tool-versions.outputs.emscripten_version }}-

      - name: Build Binaryen
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: npm run build:binaryen

      - name: Build CPython
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: npm run build:cpython

      - name: Build LLVM
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: npm run build:llvm

      - name: Build libcurl-lite
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: npm run build:libcurl-lite

      - name: Build Ninja
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: npm run build:ninja

      - name: Build CMake
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: npm run build:cmake

      - name: Build Sysroot
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: npm run build:sysroot

      - name: Patch Glue
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: npm run patch:glue

      - name: Build Manifest
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: npm run build:manifest

      - name: Build Bundles
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: npm run build:bundles

      - name: Deploy CDN
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: npm run deploy:cdn

      - name: Toolchain cache status
        run: |
          if [[ "${{ steps.cache-toolchain.outputs.cache-hit }}" == 'true' ]]; then
            echo "✅ emception toolchain cache hit — skipped heavy rebuild steps."
          else
            echo "ℹ️ emception toolchain cache miss — full rebuild executed and cache refreshed."
          fi

      - name: Upload emception CDN artifact
        uses: actions/upload-artifact@v4
        with:
          name: emception-cdn
          path: |
            tools/emception/public/cdn/
            tools/emception/build/manifest.json
          retention-days: 30

  build-web:
    name: Build apps/web
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: cd apps/web && npm install

      - name: Build web
        run: cd apps/web && npm run build

  build-api:
    name: Build apps/api
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build API
        run: cd apps/api && dotnet build "GameGuild.Production.sln" -c Release

      - name: Publish API
        run: cd apps/api/Source/GameGuild.API && dotnet publish "GameGuild.API.csproj" -c Release

  build-gource:
    name: Build gource report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg and gource
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing ffmpeg gource

      - name: Make gource script executable
        run: chmod +x ./contributors/gource.sh

      - name: Run headless gource
        uses: coactions/setup-xvfb@v1
        with:
          run: ./contributors/gource.sh

      - name: Upload gource artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gource-media
          path: |
            contributors/gource.mp4
            contributors/gource.gif
          retention-days: 30

  build-emception-demo:
    name: Build demos/emception-react
    runs-on: ubuntu-latest
    needs:
      - build-emception-toolchain
      - build-gource
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download emception CDN artifact
        uses: actions/download-artifact@v4
        with:
          name: emception-cdn
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install emception library dependencies
        run: cd tools/emception && npm install

      - name: Build emception library
        run: cd tools/emception && npm run build:lib

      - name: Install shared UI package dependencies
        run: cd packages/emception && npm install

      - name: Install demo dependencies
        run: cd demos/emception-react && npm install

      - name: Build demo
        run: cd demos/emception-react && npm run build

      - name: Upload demo dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: emception-demo-dist
          path: demos/emception-react/dist
          retention-days: 30

  bundle-pages:
    name: Bundle GitHub Pages content
    runs-on: ubuntu-latest
    needs:
      - build-emception-demo
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download demo dist artifact
        uses: actions/download-artifact@v4
        with:
          name: emception-demo-dist
          path: /tmp/emception-demo

      - name: Download gource artifact
        uses: actions/download-artifact@v4
        with:
          name: gource-media
          path: /tmp/gource-media

      - name: Assemble combined pages directory
        run: |
          rm -rf .pages
          mkdir -p .pages/contributors

          cp -R /tmp/emception-demo/* .pages/
          cp -R contributors/* .pages/contributors/

          # upload-artifact@v4 strips the common prefix, so files are at root
          cp /tmp/gource-media/gource.mp4 .pages/contributors/gource.mp4 || echo "::warning::gource.mp4 not found, skipping"
          cp /tmp/gource-media/gource.gif .pages/contributors/gource.gif || echo "::warning::gource.gif not found, skipping"

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - bundle-pages
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release-root:
    name: Update root tags & release notes
    runs-on: ubuntu-latest
    needs:
      - deploy-pages
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          lfs: false
          submodules: true

      - name: Fetch all tags
        run: |
          git fetch --tags --force
          echo "Latest tags:"
          git tag --sort=-v:refname | head -5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Semantic Release (root)
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 23
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rollback commit on release failure
        if: failure()
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git fetch --tags --force
          TAGS=$(git tag --points-at HEAD)
          for tag in $TAGS; do
            echo "Deleting tag: $tag"
            git push origin :refs/tags/$tag || true
            git tag -d $tag || true
          done
          git revert HEAD --no-edit
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-emception:
    name: Publish emception package
    runs-on: ubuntu-latest
    needs:
      - build-emception-toolchain
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build-emception-toolchain.outputs.toolchain-changed == 'true' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Sync to latest main and tags
        run: |
          git fetch origin main --tags --force
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Download emception CDN artifact
        uses: actions/download-artifact@v4
        with:
          name: emception-cdn
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install emception dependencies
        run: cd tools/emception && npm install

      - name: Build emception library
        run: cd tools/emception && npm run build:lib

      - name: Install semantic-release plugins
        run: |
          npm install --no-save \
            semantic-release@25.0.3 \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/npm \
            @semantic-release/git \
            @semantic-release/github

      - name: Semantic Release (emception)
        run: npx semantic-release --extends ./tools/emception/.releaserc.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
