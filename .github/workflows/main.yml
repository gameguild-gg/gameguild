name: Main

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          lfs: false
          submodules: true

      - name: Fetch all tags
        run: |
          git fetch --tags --force
          echo "Latest tags:"
          git tag --sort=-v:refname | head -5

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: cd apps/web ; npm install
        name: Install dependencies

      - run: cd apps/web ; npm run build
        name: Build

      - run: cd apps/api ; dotnet build "GameGuild.Production.sln" -c Release
        name: Build API

      - run: cd apps/api/Source/GameGuild.API ; dotnet publish "GameGuild.API.csproj" -c Release
        name: Publish API

      - run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing ffmpeg gource
        name: Install ffmpeg and gource

      - name: Make gource script executable
        run: chmod +x ./contributors/gource.sh

      - name: Run headless gource
        uses: coactions/setup-xvfb@v1
        with:
          run: ./contributors/gource.sh

      - name: Publish
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./contributors
          force_orphan: true

      - name: Restore baseline tag if unreachable
        run: |
          # Find the highest version tag in the repo
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "Latest tag in repo: $LATEST"
          if [ -z "$LATEST" ]; then
            echo "No version tags found — semantic-release will start fresh."
            exit 0
          fi
          # Check if the tag is reachable (an ancestor) of HEAD
          if git merge-base --is-ancestor "$LATEST" HEAD 2>/dev/null; then
            echo "$LATEST is an ancestor of HEAD — no fix needed."
          else
            echo "$LATEST is NOT reachable from HEAD (force-push history rewrite detected)."
            echo "Re-tagging $LATEST onto HEAD^ so semantic-release can detect the baseline."
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git tag -f "$LATEST" HEAD^
            git push origin "refs/tags/$LATEST" --force
            echo "Done — $LATEST now points to HEAD^."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 23
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rollback commit on build failure
        if: failure()
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git fetch --tags --force
          # Delete any tags pointing to HEAD (created by semantic-release before failure)
          TAGS=$(git tag --points-at HEAD)
          for tag in $TAGS; do
            echo "Deleting tag: $tag"
            git push origin :refs/tags/$tag || true
            git tag -d $tag || true
          done
          git reset --hard HEAD~1
          git push origin main --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
