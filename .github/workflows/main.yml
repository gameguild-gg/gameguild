name: Main

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  economy-gate:
    name: Economy CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm ci:dependencies

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.103"

      - name: Install Playwright Chromium
        run: pnpm --filter @game-guild/web exec playwright install --with-deps chromium

      - name: Verify economy baseline
        shell: pwsh
        env:
          ECONOMY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pwsh -NoProfile -File scripts/ci/verify-economy.ps1

      - name: Upload economy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economy-test-results-${{ github.sha }}
          path: artifacts/test-results
          if-no-files-found: error

  contributors:
    name: Contributors Visualization
    runs-on: ubuntu-latest
    needs: [economy-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg and gource
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing ffmpeg gource

      - name: Make gource script executable
        run: chmod +x ./contributors/gource.sh

      - name: Run headless gource
        uses: coactions/setup-xvfb@v1
        with:
          run: ./contributors/gource.sh

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./contributors
          force_orphan: true

  release:
    name: Changesets Release
    runs-on: ubuntu-latest
    needs: [economy-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm ci:dependencies

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          version: pnpm run version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
