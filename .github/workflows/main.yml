name: Main

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          lfs: false
          submodules: true

      - name: Fetch all tags
        run: |
          git fetch --tags --force
          echo "Latest tags:"
          git tag --sort=-v:refname | head -5

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: cd apps/web ; npm install
        name: Install dependencies

      - run: cd apps/web ; npm run build
        name: Build

      - run: cd apps/api ; dotnet build "GameGuild.Production.sln" -c Release
        name: Build API

      - run: cd apps/api/Source/GameGuild.API ; dotnet publish "GameGuild.API.csproj" -c Release
        name: Publish API

      - run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing ffmpeg gource
        name: Install ffmpeg and gource

      - name: Make gource script executable
        run: chmod +x ./contributors/gource.sh

      - name: Run headless gource
        uses: coactions/setup-xvfb@v1
        with:
          run: ./contributors/gource.sh

      - name: Publish
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./contributors
          force_orphan: true

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 23
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rollback commit on build failure
        if: failure()
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git fetch --tags --force
          # Delete any tags pointing to HEAD (created by semantic-release before failure)
          TAGS=$(git tag --points-at HEAD)
          for tag in $TAGS; do
            echo "Deleting tag: $tag"
            git push origin :refs/tags/$tag || true
            git tag -d $tag || true
          done
          # Revert instead of reset+force-push — preserves history so tags stay reachable
          git revert HEAD --no-edit
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
