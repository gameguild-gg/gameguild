name: PR Verify

on:
  pull_request:
    branches: [main, develop, "feature/**"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read

# Official PostgreSQL indexes via Google's cache; see scripts/ci/postgres-test-images.md.
env:
  GAMEGUILD_TEST_POSTGRES_17_IMAGE: "mirror.gcr.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24"
  GAMEGUILD_TEST_POSTGRES_16_IMAGE: "mirror.gcr.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea"

concurrency:
  # Suffixed during PR #773 repair: synchronize events stopped creating runs for
  # this PR (dropped/stuck pending in the original group). Distinct group + manual
  # dispatch unblocks verification; revert together with the repair.
  group: pr-verify-${{ github.event.pull_request.number }}-repair773
  cancel-in-progress: true

jobs:
  runner-pool:
    name: Select runner pool
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      pool: ${{ steps.select.outputs.pool }}
      docker-pool: ${{ steps.select.outputs.docker_pool }}
    steps:
      - name: Choose self-hosted pool or GitHub-hosted overflow
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          set -eu
          # ARC runner pods have no Docker daemon: jobs that run Postgres via
          # docker (API/economy test gates) always use GitHub-hosted runners.
          echo 'docker_pool=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          if [[ "$FORK_PR" == 'true' ]]; then
            echo 'Fork PR: untrusted code must never run on self-hosted hardware.' >&2
            echo 'pool=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pool='["self-hosted","gameguild"]'
          response=$(curl -s -w '\n%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPOSITORY/actions/runners" || echo $'\n000')
          status=$(tail -n1 <<<"$response")
          body=$(sed '$d' <<<"$response")
          if [[ "$status" == '200' ]]; then
            total=$(jq '[.runners[] | select(any(.labels[]; .name == "gameguild"))] | length' <<<"$body")
            busy=$(jq '[.runners[] | select(any(.labels[]; .name == "gameguild")) | select(.busy == true)] | length' <<<"$body")
            echo "Self-hosted ARC runners: total=$total busy=$busy (max 9)."
            if [[ "$busy" -ge 9 ]]; then
              echo 'All 9 ARC runners busy; overflowing to GitHub-hosted.' >&2
              pool='["ubuntu-latest"]'
            fi
          else
            echo "Runner list unavailable (HTTP $status); using GitHub-hosted overflow." >&2
            pool='["ubuntu-latest"]'
          fi
          echo "pool=$pool" >> "$GITHUB_OUTPUT"

  classify:
    name: Classify release surfaces
    needs: runner-pool
    runs-on: ${{ fromJSON(needs.runner-pool.outputs.pool) }}
    outputs:
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
      testingLab: ${{ steps.changes.outputs.testingLab }}
      economyCritical: ${{ steps.changes.outputs.economyCritical }}
      openApi: ${{ steps.changes.outputs.openApi }}
      migration: ${{ steps.changes.outputs.migration }}
      runtimeChanged: ${{ steps.changes.outputs.runtimeChanged }}
      apiRuntimeChanged: ${{ steps.changes.outputs.apiRuntimeChanged }}
      webRuntimeChanged: ${{ steps.changes.outputs.webRuntimeChanged }}
      changedFiles: ${{ steps.changes.outputs.changedFiles }}
      serviceMatrix: ${{ steps.changes.outputs.serviceMatrix }}
      runtimeServiceMatrix: ${{ steps.changes.outputs.runtimeServiceMatrix }}
      treeSha: ${{ steps.identity.outputs.treeSha }}
      baseSha: ${{ steps.revs.outputs.base }}
      headSha: ${{ steps.revs.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Resolve PR base and head commits
        id: revs
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base=$(git merge-base HEAD origin/develop); fi
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$head" ]; then head=$(git rev-parse HEAD); fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: Classify changed paths
        id: changes
        run: >-
          node scripts/ci/classify-release-changes.mjs
          --base "${{ steps.revs.outputs.base }}"
          --head "${{ steps.revs.outputs.head }}"
      - name: Resolve merge-ref tree
        id: identity
        run: echo "treeSha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Test classifier contract
        run: |
          node --test apps/web/scripts/coding-cycle-grading-transport.test.mjs
          node --test scripts/ci/tests/classify-release-changes.test.mjs scripts/ci/tests/select-affected-dotnet-tests.test.mjs scripts/ci/tests/postgres-images.test.mjs scripts/ci/tests/pull-ci-image.test.mjs scripts/ci/tests/emception-web-artifacts.test.mjs apps/web/scripts/coding-cycle-editor-support.test.mjs apps/web/scripts/coding-cycle-toolchain-support.test.mjs
          node --test scripts/ci/tests/dotnet-cache-policy.test.mjs
          node --test scripts/ci/tests/api-integration-filter.test.mjs
          node --test scripts/ci/tests/pr-required-gate.test.mjs
          python3 -m unittest discover -s scripts/ci/tests -p 'acquire_emception_release_test.py'
      - name: Test docker build-context invariants
        run: node --test scripts/ci/tests/dockerignore-pnpm-patches.test.mjs scripts/ci/tests/dockerignore-api-analyzer-config.test.mjs

  secret-scan:
    name: PR secret scan
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all PR commits and the tested merge
        env:
          SOURCE_BASE_SHA: ${{ needs.classify.outputs.baseSha }}
          SOURCE_HEAD_SHA: ${{ needs.classify.outputs.headSha }}
        run: bash scripts/ci/verify-pr-secrets.sh
      - name: Preserve redacted secret scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: secret-scan-${{ needs.classify.outputs.headSha }}
          path: artifacts/secret-scan
          if-no-files-found: error

  repository-policy:
    name: Repository policy
    needs: runner-pool
    runs-on: ${{ fromJSON(needs.runner-pool.outputs.pool) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-workspace
      - name: Verify repository policy
        run: bash scripts/ci/verify-repository-policy.sh
      - name: Verify grading and JavaScript runtime contracts
        run: |
          node tools/emception/grading/build.mjs
          node --test apps/web/scripts/sync-javascript-runtime.test.mjs
          node --test scripts/ci/tests/dev-runtime-registration.test.mjs scripts/ci/tests/lint-budget.test.mjs
          node --test scripts/ci/tests/eslint-root-config.test.mjs
      - name: Upload policy evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: repository-policy-${{ github.event.pull_request.head.sha }}
          path: artifacts/test-results
          if-no-files-found: error

  web:
    name: Web verify
    needs: [runner-pool, classify]
    if: needs.classify.outputs.web == 'true'
    runs-on: ${{ fromJSON(needs.runner-pool.outputs.pool) }}
    # Include the bounded producer wait and the existing Web gates.
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-workspace
      - name: Build generated client
        run: pnpm --filter @game-guild/client build
      - name: Test client credentials, MFA, auth factory, transport and generator contracts
        run: pnpm --filter @game-guild/client exec vitest run tests/auth/providers/credentials.test.ts tests/next/auth.test.ts tests/next/actions-extended.test.ts tests/gaps/final-gaps.test.ts tests/react/query-hooks-extended.test.ts tests/generator tests/transport --maxWorkers=1
      - name: Test delivered WalletConnect runtime
        run: pnpm --filter @game-guild/web3 exec vitest run src/adapters/walletconnect.runtime.test.ts src/adapters/walletconnect.test.ts --maxWorkers=1
      - name: Acquire verified Toolchain release for Web
        id: emception-web-release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD_SHA: ${{ needs.classify.outputs.headSha }}
          CHANGED_PATHS: ${{ needs.classify.outputs.changedFiles }}
        run: SOURCE_TREE_SHA="$(git rev-parse 'HEAD^{tree}')" python3 scripts/ci/acquire-emception-release.py --wait-seconds 19800
      - name: Verify acquired frozen Toolchain identity
        if: steps.emception-web-release.outputs.required == 'true'
        run: |
          node --input-type=module -e "import { verifyCodingCycleToolchain } from './apps/web/scripts/coding-cycle-toolchain-support.mjs'; await verifyCodingCycleToolchain('./tools/emception/artifacts/toolchain/release/cdn/manifest.json');"
      - name: Build Web runtime dependencies
        run: pnpm --filter @game-guild/web run build:emception-dependencies
      - name: Generate Web route types
        run: pnpm --filter @game-guild/web exec next typegen
      - name: Lint Web
        id: web-lint
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: pnpm --filter @game-guild/web lint --format json --output-file "$RUNNER_TEMP/web-lint.json"
      - name: Preserve Web lint diagnostics
        if: ${{ failure() && steps.web-lint.outcome == 'failure' }}
        env:
          CANDIDATE_HEAD: ${{ needs.classify.outputs.headSha }}
        run: |
          mkdir -p "$RUNNER_TEMP/web-lint-evidence"
          cp "$RUNNER_TEMP/web-lint.json" "$RUNNER_TEMP/web-lint-evidence/eslint.json"
          printf '%s\n' "$CANDIDATE_HEAD" > "$RUNNER_TEMP/web-lint-evidence/head.txt"
          git -c core.commitGraph=false rev-parse HEAD > "$RUNNER_TEMP/web-lint-evidence/checkout.txt"
          git -c core.commitGraph=false rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/web-lint-evidence/tree.txt"
          sha256sum apps/web/eslint.config.mjs apps/web/eslint-suppressions.json > "$RUNNER_TEMP/web-lint-evidence/config-sha256.txt"
      - name: Upload Web lint diagnostics
        if: ${{ failure() && steps.web-lint.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-lint-${{ needs.classify.outputs.headSha }}
          path: ${{ runner.temp }}/web-lint-evidence
          if-no-files-found: error
      - name: Lint suppression budget ratchet
        run: node scripts/lint-budget.mjs
      - name: Typecheck Web
        run: pnpm --filter @game-guild/web exec tsc --noEmit
      - name: Validate quiz grading audit contracts
        run: |
          pnpm --filter @game-guild/web test:grading:validation
          pnpm --filter @game-guild/grading test
          pnpm --filter @game-guild/grading-adapter-quiz test
      - name: Test Web
        run: pnpm --filter @game-guild/web exec vitest run --maxWorkers=4
      - name: Build Web
        env:
          GAMEGUILD_DISABLE_WEBPACK_CACHE: "1"
          NODE_OPTIONS: --max-old-space-size=12288
        run: pnpm --filter @game-guild/web build

  api:
    name: API verify
    needs: [runner-pool, classify]
    if: needs.classify.outputs.api == 'true'
    runs-on: ${{ fromJSON(needs.runner-pool.outputs.docker-pool) }}
    # Broad API changes select the full suite of affected test projects.
    # Keep the per-test hang limit and allow the sequential suite to finish.
    # Full host regression takes about 30 minutes before additional affected module suites.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-dotnet
      - name: Build API
        run: >-
          dotnet build apps/api/Source/GameGuild.API/GameGuild.API.csproj
          -c Release --nologo -p:TreatWarningsAsErrors=true
      - name: Verify audit schema and authentication before full API regression
        # Keep exact model-drift operations in TRX before running every HTTP case.
        run: >-
          dotnet test apps/api/tests/GameGuild.API.IntegrationTests/GameGuild.API.IntegrationTests.csproj
          -c Release --nologo -p:TreatWarningsAsErrors=true
          --filter "FullyQualifiedName~AuditSnapshotMigrationPostgreSqlTests|FullyQualifiedName~MfaSignInPolicyPostgreSqlTests|FullyQualifiedName~AuditExportPostgreSqlHttpTests.Concurrent_alias_and_versioned_exports_share_the_user_rate_limit"
          --logger "trx;LogFileName=audit-schema.trx"
          --results-directory artifacts/test-results/affected-api/audit-schema
      - name: Run affected API tests
        shell: bash
        run: >-
          bash scripts/ci/run-affected-dotnet-tests.sh
          --base "${{ needs.classify.outputs.baseSha }}"
          --head "${{ needs.classify.outputs.headSha }}"
      - name: Verify mandatory identity and host security suites
        shell: bash
        run: |
          for TEST_PROJECT in GameGuild.Identity.Authentication.UnitTests GameGuild.Identity.Authorization.UnitTests GameGuild.API.UnitTests; do
            dotnet test "apps/api/tests/${TEST_PROJECT}/${TEST_PROJECT}.csproj" \
              -c Release --nologo -p:TreatWarningsAsErrors=true \
              --blame-hang-timeout 5m --logger "trx;LogFileName=${TEST_PROJECT}.trx" \
              --results-directory "artifacts/test-results/affected-api/mandatory-security/${TEST_PROJECT}"
          done
      - name: Upload affected API test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: affected-api-${{ github.event.pull_request.head.sha }}
          path: artifacts/test-results/affected-api
          if-no-files-found: warn
      - name: Build full-application OpenAPI HTTP tests
        run: >-
          dotnet build apps/api/tests/GameGuild.API.IntegrationTests/GameGuild.API.IntegrationTests.csproj
          -c Release --nologo -p:TreatWarningsAsErrors=true
      - name: Release build servers before HTTP verification
        run: dotnet build-server shutdown
      - name: Verify full-application OpenAPI over HTTP
        env:
          DOTNET_GCHeapHardLimit: "100000000"
          DOTNET_GCConserveMemory: "5"
          DOTNET_gcServer: "0"
          DOTNET_PROCESSOR_COUNT: "4"
        run: >-
          dotnet test apps/api/tests/GameGuild.API.IntegrationTests/GameGuild.API.IntegrationTests.csproj
          -c Release --no-build --no-restore --nologo --filter FullyQualifiedName~OpenApi
          --blame-hang-timeout 5m --logger "trx;LogFileName=full-application-openapi.trx"
          --results-directory artifacts/test-results/full-application-openapi
      - name: Upload full-application OpenAPI HTTP evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: full-application-openapi-${{ github.event.pull_request.head.sha }}
          path: artifacts/test-results/full-application-openapi
          if-no-files-found: warn

  testing-lab:
    name: Testing Lab critical flow
    needs: [runner-pool, classify, web, api]
    if: >-
      always() &&
      needs.classify.outputs.testingLab == 'true' &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      (needs.api.result == 'success' || needs.api.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-workspace
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/setup-playwright
      - name: Run Testing Lab browser workflow
        env:
          TESTING_LAB_E2E_ARTIFACTS: ${{ github.workspace }}/artifacts/test-results/testing-lab
        run: pnpm --filter @game-guild/web test:browser:testing-lab
      - name: Upload Testing Lab evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: testing-lab-${{ github.event.pull_request.head.sha }}
          path: artifacts/test-results
          if-no-files-found: error

  openapi:
    name: OpenAPI client consistency
    needs: [runner-pool, classify]
    if: needs.classify.outputs.openApi == 'true'
    runs-on: ${{ fromJSON(needs.runner-pool.outputs.pool) }}
    timeout-minutes: 40
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: gameguild
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d gameguild"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=gameguild;Username=postgres;Password=postgres
      ConnectionStrings__AuthenticationDb: Host=localhost;Port=5432;Database=gameguild;Username=postgres;Password=postgres
      ConnectionStrings__MigrationConnection: Host=localhost;Port=5432;Database=gameguild;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-workspace
      - uses: ./.github/actions/setup-dotnet
      - name: Verify generated OpenAPI client
        run: bash scripts/ci/verify-openapi-surface.sh
      - name: Upload OpenAPI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openapi-${{ github.event.pull_request.head.sha }}
          path: artifacts/test-results/openapi
          if-no-files-found: error

  migration:
    name: Migration compatibility
    needs: [runner-pool, classify]
    if: needs.classify.outputs.migration == 'true'
    runs-on: ${{ fromJSON(needs.runner-pool.outputs.docker-pool) }}
    timeout-minutes: 40
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: gameguild
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d gameguild"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: gameguild
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-workspace
      - uses: ./.github/actions/setup-dotnet
      - run: dotnet tool restore
      - run: dotnet restore apps/api/Source/GameGuild.API/GameGuild.API.csproj
      - name: Apply migrations to a clean database
        run: >-
          dotnet ef database update
          --project apps/api/Source/GameGuild.API/GameGuild.API.csproj
          --startup-project apps/api/Source/GameGuild.API/GameGuild.API.csproj
      - name: Verify model and migrated schema agree
        run: pnpm db:dbml:verify

  economy:
    name: Economy Release Gate
    needs: [runner-pool, classify, economy-api, economy-client]
    if: needs.classify.outputs.economyCritical == 'true'
    runs-on: ${{ fromJSON(needs.runner-pool.outputs.docker-pool) }}
    # Reuse the same-run API/client outputs. Coverage and regression remain
    # required independent jobs; this lane verifies OpenAPI/web/browser surfaces.
    # Chromium system dependencies plus the release checks can consume 20 minutes
    # before artifact upload and cleanup complete. Keep time for both phases.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-workspace
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/setup-playwright
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: economy-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/economy-inputs/api
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: economy-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/economy-inputs/client
      - name: Run Economy release surfaces
        env:
          ECONOMY_GATE_PROFILE: browser
          ECONOMY_INPUT_ROOT: ${{ runner.temp }}/economy-inputs
          ECONOMY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/verify-economy.sh
      - name: Upload Economy evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: economy-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/test-results
            !artifacts/test-results/economy/publish/**
          if-no-files-found: error

  economy-api:
    name: Economy API publish
    needs: [runner-pool, classify]
    if: needs.classify.outputs.economyCritical == 'true'
    runs-on: ${{ fromJSON(needs.runner-pool.outputs.docker-pool) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-workspace
      - uses: ./.github/actions/setup-dotnet
      - name: Publish warning-clean API for browser verification
        env:
          ECONOMY_GATE_PROFILE: api-bundle
        run: bash scripts/ci/verify-economy.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: economy-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/economy-bundles/api
          if-no-files-found: error
          compression-level: 0
      - name: Upload API producer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: economy-api-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/test-results/economy
            !artifacts/test-results/economy/publish/**
          if-no-files-found: error

  economy-client:
    name: Economy client tests and build
    needs: [runner-pool, classify]
    if: needs.classify.outputs.economyCritical == 'true'
    runs-on: ${{ fromJSON(needs.runner-pool.outputs.docker-pool) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-workspace
      - name: Test and build complete client for browser verification
        env:
          ECONOMY_GATE_PROFILE: client-bundle
        run: bash scripts/ci/verify-economy.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: economy-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/economy-bundles/client
          if-no-files-found: error
          compression-level: 0
      - name: Upload client producer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: economy-client-evidence-${{ github.event.pull_request.head.sha }}
          path: artifacts/test-results/economy
          if-no-files-found: error

  economy-coverage:
    name: Economy coverage and provider contracts
    needs: [runner-pool, classify]
    if: needs.classify.outputs.economyCritical == 'true'
    runs-on: ${{ fromJSON(needs.runner-pool.outputs.docker-pool) }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-workspace
      - uses: ./.github/actions/setup-dotnet
      - name: Build full solution and verify complete Economy coverage
        env:
          ECONOMY_GATE_PROFILE: coverage
        run: bash scripts/ci/verify-economy.sh
      - name: Upload Economy coverage and provider evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: economy-coverage-${{ github.event.pull_request.head.sha }}
          path: artifacts/test-results/economy
          if-no-files-found: error

  economy-regression:
    name: Economy regression (${{ matrix.shard }})
    needs: [runner-pool, classify]
    if: needs.classify.outputs.economyCritical == 'true'
    runs-on: ${{ fromJSON(needs.runner-pool.outputs.docker-pool) }}
    # Whole-solution shards (api-unit, remaining-*) run the sequential full API
    # unit suite, which takes ~30 minutes alone; the job timeout must cover it.
    timeout-minutes: 60
    strategy:
      # Keep every shard's evidence when another shard fails.
      fail-fast: false
      matrix:
        shard: [api-integration-1, api-integration-2, api-integration-3, api-integration-4, api-unit, remaining-1, remaining-2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-workspace
      - uses: ./.github/actions/setup-dotnet
      - name: Run whole-solution regression shard
        env:
          ECONOMY_GATE_PROFILE: regression
          ECONOMY_REGRESSION_SHARD: ${{ matrix.shard }}
          ECONOMY_WHOLE_SOLUTION_JOBS: "2"
          ECONOMY_API_TEST_TIMEOUT: 35m
          ECONOMY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/verify-economy.sh
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: economy-regression-${{ matrix.shard }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/test-results/economy
          if-no-files-found: error

  required-gate:
    name: PR Required Gate
    if: always()
    needs:
      [
        runner-pool,
        classify,
        secret-scan,
        repository-policy,
        web,
        api,
        testing-lab,
        openapi,
        migration,
        economy,
        economy-api,
        economy-client,
        economy-coverage,
        economy-regression,
      ]
    runs-on: ${{ fromJSON(needs.runner-pool.outputs.pool) }}
    steps:
      - name: Require every selected gate
        # toJSON(needs) embeds classify's changedFiles list; on large PRs that
        # env var exceeds the kernel execve limit and bash cannot even start
        # ("Argument list too long"). Pass each job's result string instead.
        env:
          CLASSIFY: ${{ needs.classify.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          REPOSITORY_POLICY: ${{ needs.repository-policy.result }}
          WEB: ${{ needs.web.result }}
          WEB_SELECTED: ${{ needs.classify.outputs.web }}
          API: ${{ needs.api.result }}
          API_SELECTED: ${{ needs.classify.outputs.api }}
          TESTING_LAB: ${{ needs.testing-lab.result }}
          OPENAPI: ${{ needs.openapi.result }}
          MIGRATION: ${{ needs.migration.result }}
          ECONOMY: ${{ needs.economy.result }}
          ECONOMY_API: ${{ needs.economy-api.result }}
          ECONOMY_CLIENT: ${{ needs.economy-client.result }}
          ECONOMY_COVERAGE: ${{ needs.economy-coverage.result }}
          ECONOMY_REGRESSION: ${{ needs.economy-regression.result }}
          ECONOMY_SELECTED: ${{ needs.classify.outputs.economyCritical }}
        run: |
          fail=0; missing=""
          check() { case "$2" in success) ;; *) missing="$missing $1=$2"; fail=1 ;; esac; }
          check classify "$CLASSIFY"
          check secret-scan "$SECRET_SCAN"
          check repository-policy "$REPOSITORY_POLICY"
          case "$WEB_SELECTED:$WEB" in
            false:skipped) ;;
            *) check web "$WEB" ;;
          esac
          case "$API_SELECTED:$API" in
            false:skipped) ;;
            *) check api "$API" ;;
          esac
          if [ "$ECONOMY_SELECTED" = "true" ]; then
            for g in economy economy-api economy-client economy-coverage economy-regression; do
              case "$g" in
                economy) r="$ECONOMY" ;;
                economy-api) r="$ECONOMY_API" ;;
                economy-client) r="$ECONOMY_CLIENT" ;;
                economy-coverage) r="$ECONOMY_COVERAGE" ;;
                economy-regression) r="$ECONOMY_REGRESSION" ;;
              esac
              case "$r" in success) ;; *) missing="$missing $g=$r"; fail=1 ;; esac
            done
          fi
          if [ "$fail" -ne 0 ]; then
            echo "Required PR gates failed:$missing" >&2
            exit 1
          fi
          echo 'Every selected PR gate passed or was intentionally skipped.'
