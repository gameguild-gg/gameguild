name: Emception CI/CD

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/emception.yml'
      - 'apps/web/src/types/global.d.ts'
      - 'demos/emception-*/**'
      - 'docs/frontend/emception-workspace-config.md'
      - 'package.json'
      - 'packages/infrastructure/ui-emception/**'
      - 'pnpm-workspace.yaml'
      - 'scripts/emception/**'
      - 'scripts/sync-emception-cdn.mjs'
      - 'tools/emception/**'
      - 'tsconfig.json'
      - 'turbo.json'
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/emception.yml'
      - 'apps/web/src/types/global.d.ts'
      - 'demos/emception-*/**'
      - 'docs/frontend/emception-workspace-config.md'
      - 'package.json'
      - 'packages/infrastructure/ui-emception/**'
      - 'pnpm-workspace.yaml'
      - 'scripts/emception/**'
      - 'scripts/sync-emception-cdn.mjs'
      - 'tools/emception/**'
      - 'tsconfig.json'
      - 'turbo.json'
  workflow_dispatch:
    inputs:
      publish_packages:
        description: Publish unpublished Emception package versions to npm after validation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: emception-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.0.0'

jobs:
  build-test-package:
    name: Build, test, and package Emception
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CI: 'true'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          lfs: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install workspace dependencies
        run: pnpm install --no-lockfile --ignore-scripts

      - name: Cache Emscripten SDK
        id: cache-emsdk
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tools/emception/tools/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('tools/emception/scripts/setup-emsdk.ts', 'tools/emception/scripts/lib/pinned-versions.ts') }}

      - name: Cache userland sources and builds
        id: cache-userland
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tools/emception/userland
          key: userland-${{ runner.os }}-${{ hashFiles('tools/emception/scripts/build-*.ts', 'tools/emception/scripts/lib/**', 'tools/emception/userland/**/BUILD.md', 'tools/emception/userland/**/patches/**', 'tools/emception/userland/**/*.c', 'tools/emception/userland/**/*.h') }}
          restore-keys: |
            userland-${{ runner.os }}-

      - name: Cache sysroot and CDN bundles
        id: cache-cdn
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            tools/emception/sysroot
            tools/emception/build
            tools/emception/public/cdn
          key: emception-cdn-${{ runner.os }}-${{ hashFiles('tools/emception/scripts/**', 'tools/emception/userland/**/BUILD.md', 'tools/emception/userland/**/patches/**', 'tools/emception/userland/**/*.c', 'tools/emception/userland/**/*.h') }}
          restore-keys: |
            emception-cdn-${{ runner.os }}-

      - name: Install native toolchain dependencies
        if: steps.cache-cdn.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing brotli build-essential cmake ninja-build pkg-config

      - name: Free disk space and configure build swap
        if: steps.cache-cdn.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

          sudo swapoff -a || true
          sudo rm -f /mnt/emception-swapfile
          sudo fallocate -l 8G /mnt/emception-swapfile
          sudo chmod 600 /mnt/emception-swapfile
          sudo mkswap /mnt/emception-swapfile
          sudo swapon /mnt/emception-swapfile
          free -h

      - name: Build browser C++ toolchain and CDN
        if: steps.cache-cdn.outputs.cache-hit != 'true'
        run: pnpm --dir tools/emception run build:all

      - name: Build all Emception packages
        run: pnpm run build:emception

      - name: Type-check all Emception packages
        run: pnpm run typecheck:emception

      - name: Run Emception unit tests
        run: pnpm run test:emception

      - name: Run Emception public type tests
        run: pnpm run test:emception:types

      - name: Install Chromium for browser smoke tests
        run: pnpm --dir tools/emception exec playwright install --with-deps chromium

      - name: Run browser C++ compilation smoke test
        run: pnpm run test:emception:e2e

      - name: Stage CDN into packages and demo applications
        run: |
          node scripts/sync-emception-cdn.mjs tools/emception/apps/ide-react
          pnpm --dir tools/emception run stage:core:cdn

      - name: Build Emception web consumers
        run: pnpm --filter "@gameguild/emception-demo-*" --filter "@game-guild/emception-demo-*" run build

      - name: Build GameGuild web application with Emception contracts
        run: pnpm turbo run build --filter=@game-guild/web

      - name: Build GitHub Pages IDE
        run: pnpm --dir tools/emception/apps/ide-react run build
        env:
          VITE_BASE: /gameguild/

      - name: Verify deployable output
        shell: bash
        run: |
          test -f tools/emception/apps/ide-react/dist/index.html
          test -f tools/emception/public/cdn/manifest.json
          test -d tools/emception/packages/core/dist
          test -d tools/emception/packages/core/cdn
          test -d tools/emception/packages/browser/dist
          test -d tools/emception/packages/xterm/dist
          test -d tools/emception/packages/react/dist
          test -d tools/emception/packages/webcomponent/dist
          test -d tools/emception/packages/ide/dist

      - name: Upload Emception release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emception-${{ github.sha }}
          path: |
            tools/emception/apps/ide-react/dist
            tools/emception/public/cdn
            tools/emception/packages/core/dist
            tools/emception/packages/core/cdn
            tools/emception/packages/browser/dist
            tools/emception/packages/xterm/dist
            tools/emception/packages/react/dist
            tools/emception/packages/webcomponent/dist
            tools/emception/packages/ide/dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emception-browser-diagnostics-${{ github.sha }}
          path: |
            tools/emception/playwright-report
            tools/emception/test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy-pages:
    name: Deploy Emception IDE and CDN
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build-test-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Emception release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: emception-${{ github.sha }}
          path: _artifacts/emception

      - name: Assemble GitHub Pages payload
        shell: bash
        run: |
          SOURCE="_artifacts/emception"
          if [[ -d "${SOURCE}/tools/emception" ]]; then
            SOURCE="${SOURCE}/tools/emception"
          fi

          test -f "${SOURCE}/apps/ide-react/dist/index.html"
          test -f "${SOURCE}/public/cdn/manifest.json"

          rm -rf .pages
          mkdir -p .pages
          cp -R "${SOURCE}/apps/ide-react/dist/." .pages/
          rm -rf .pages/cdn
          cp -R "${SOURCE}/public/cdn" .pages/cdn
          find .pages -name '.gitignore' -delete

          echo "Pages payload: $(du -sh .pages | cut -f1)"
          echo "CDN payload: $(du -sh .pages/cdn | cut -f1)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  publish-packages:
    name: Publish Emception packages to npm
    if: github.event_name == 'workflow_dispatch' && inputs.publish_packages
    needs: build-test-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure npm registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Download validated package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: emception-${{ github.sha }}
          path: _artifacts/emception

      - name: Restore validated package outputs
        shell: bash
        run: |
          SOURCE="_artifacts/emception"
          if [[ -d "${SOURCE}/tools/emception" ]]; then
            SOURCE="${SOURCE}/tools/emception"
          fi

          rsync -a "${SOURCE}/packages/" tools/emception/packages/

      - name: Publish unpublished package versions
        working-directory: tools/emception
        shell: bash
        run: |
          PACKAGE_DIRS=(
            "packages/core"
            "packages/xterm"
            "packages/browser"
            "packages/react"
            "packages/webcomponent"
            "packages/ide"
          )

          for DIR in "${PACKAGE_DIRS[@]}"; do
            NAME="$(node -p "require('./${DIR}/package.json').name")"
            VERSION="$(node -p "require('./${DIR}/package.json').version")"

            if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
              echo "${NAME}@${VERSION} is already published; skipping."
              continue
            fi

            test -d "${DIR}/dist"
            echo "Publishing ${NAME}@${VERSION}"
            npm publish "./${DIR}" --access public --ignore-scripts --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
