name: Nightly Full

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-full
  cancel-in-progress: false

jobs:
  runner-pool:
    name: Select runner pool
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      pool: ${{ steps.select.outputs.pool }}
    steps:
      - name: Choose self-hosted pool or GitHub-hosted overflow
        id: select
        env:
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          set -eu
          if [[ "$FORK_PR" == 'true' ]]; then
            echo 'Fork PR: untrusted code must never run on self-hosted hardware.' >&2
            echo 'pool=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The runner-count probe against /actions/runners was removed: that
          # endpoint is admin-only and GITHUB_TOKEN always gets HTTP 403.
          # ARC autoscales 0..9 on demand; self-hosted is the default.
          echo 'pool=["gameguild"]' >> "$GITHUB_OUTPUT"

  full-verification:
    name: Full solution, Economy, browser, and OpenAPI
    needs: runner-pool
    # Runs Postgres via docker; ARC runner pods have no Docker daemon.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-workspace
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/setup-playwright
      - name: Run complete verification
        env:
          ECONOMY_GATE_PROFILE: full
          ECONOMY_WHOLE_SOLUTION_JOBS: "2"
          ECONOMY_BASE_SHA: ${{ github.event.before || github.sha }}
        run: bash scripts/ci/verify-economy.sh
      - name: Upload nightly evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-full-${{ github.sha }}
          path: artifacts/test-results
          if-no-files-found: error
