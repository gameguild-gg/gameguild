name: Release

# Auto-version packages after the Main workflow has completed its economy and
# contributors jobs for a main push. Main calls this workflow directly so the
# reusable workflow inherits the verified caller SHA instead of the repository
# default branch SHA used by workflow_run.
#
# Flow:
#   1. Main calls this reusable workflow after its required jobs pass.
#   2. The guard waits for Emception CI/CD to pass on the same SHA.
#   3. The release job:
#      - runs scripts/devops/auto-changeset.mjs to convert conventional
#        commits since the last tag into a .changeset/auto-*.md file
#      - runs changesets/action which either:
#          * opens/updates a "Version Packages" PR (if changesets pending), or
#          * publishes pending version bump to npm (if Version PR merged)
#
# `BREAKING CHANGE:` commit footer or `feat!:`/`fix!:` marker → major bump.
# `feat:` → minor. `fix:`/`perf:`/`refactor:`/`revert:` → patch.
# See scripts/devops/auto-changeset.mjs for the full classification rules.

on:
  workflow_call:
    inputs:
      sha:
        description: Verified commit SHA from the caller workflow
        required: true
        type: string
      branch:
        description: Release base branch from the caller workflow
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-${{ inputs.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.0.0'

jobs:
  wait-for-emception:
    name: Emception CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Wait for Emception CI on the verified SHA
        uses: actions/github-script@v9 # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = '${{ inputs.sha }}';
            const headBranch = '${{ inputs.branch }}';
            const terminalStatuses = new Set(['completed']);
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

            if (headBranch !== 'main') {
              core.setFailed(`Release is restricted to main, received '${headBranch}'.`);
              return;
            }

            for (let attempt = 1; attempt <= 260; attempt += 1) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'emception.yml',
                head_sha: headSha,
                per_page: 50,
              });

              const matching = runs.data.workflow_runs.filter(
                (r) => r.head_sha === headSha && r.event !== 'pull_request'
              );
              if (matching.some((run) => run.conclusion === 'success')) {
                core.info(`Emception CI/CD passed for ${headSha.substring(0, 8)}.`);
                return;
              }

              const active = matching.some((run) => !terminalStatuses.has(run.status));
              if (matching.length > 0 && !active) {
                const conclusions = matching.map((run) => run.conclusion ?? run.status);
                core.setFailed(`Emception CI/CD did not pass for ${headSha.substring(0, 8)}: ${conclusions.join(', ')}.`);
                return;
              }

              core.info(`Waiting for Emception CI/CD on ${headSha.substring(0, 8)} (attempt ${attempt}/260).`);
              await sleep(30000);
            }

            core.setFailed(`Timed out waiting for Emception CI/CD on ${headSha.substring(0, 8)}.`);

  release:
    name: Auto-version and publish
    runs-on: ubuntu-latest
    needs: wait-for-emception
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v4
        with:
          # The reusable caller grants the token write access for the verified
          # main commit and passes that exact SHA here.
          fetch-depth: 0
          ref: ${{ inputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          # .npmrc above already sets this; belt-and-braces for `npm publish`.

      - name: Configure npm auth
        run: printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> ~/.npmrc

      - name: Install dependencies
        run: pnpm install --no-lockfile --ignore-scripts

      - name: Generate changeset from commits
        run: node scripts/devops/auto-changeset.mjs

      - name: No release-relevant commits?
        id: has-changeset
        run: |
          if ls .changeset/auto-*.md 2>/dev/null | grep -q .; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Generated changeset:"
            cat .changeset/auto-*.md
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "No release-relevant commits since last tag — nothing to release."
          fi

      - name: Create Release Pull Request or Publish
        if: steps.has-changeset.outputs.proceed == 'true'
        uses: changesets/action@v2 # v1
        with:
          branch: ${{ inputs.branch }}
          publish: pnpm run release
          version: pnpm run version
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
