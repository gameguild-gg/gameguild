name: Release

# Auto-version packages when BOTH the Main (economy) and Emception CI/CD
# workflows complete successfully on the same commit, on main or develop.
#
# Flow:
#   1. workflow_run triggers when Main OR Emception CI/CD finishes.
#   2. Guard job checks: triggered branch is main/develop, the triggering
#      workflow succeeded, AND the OTHER required workflow also succeeded
#      for the same SHA.
#   3. release job:
#      - runs scripts/devops/auto-changeset.mjs to convert conventional
#        commits since the last tag into a .changeset/auto-*.md file
#      - runs changesets/action which either:
#          * opens/updates a "Version Packages" PR (if changesets pending), or
#          * publishes pending version bump to npm (if Version PR merged)
#
# `BREAKING CHANGE:` commit footer or `feat!:`/`fix!:` marker → major bump.
# `feat:` → minor. `fix:`/`perf:`/`refactor:`/`revert:` → patch.
# See scripts/devops/auto-changeset.mjs for the full classification rules.

on:
  workflow_run:
    workflows: [Main, Emception CI/CD]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.0.0'

jobs:
  # Gate: only proceed when the triggering run succeeded AND the sibling
  # workflow also succeeded for this SHA. workflow_run fires once per
  # upstream completion — without this gate we'd release on whichever
  # finishes first.
  gate:
    name: Both CIs passed
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      sha: ${{ github.event.workflow_run.head_sha }}
      branch: ${{ steps.check.outputs.branch }}
    steps:
      - name: Check both workflows succeeded for this SHA
        id: check
        uses: actions/github-script@v9 # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const headBranch = context.payload.workflow_run.head_branch;
            const triggerConclusion = context.payload.workflow_run.conclusion;
            const triggerWorkflow = context.payload.workflow_run.name;

            core.info(`Triggered by ${triggerWorkflow} on ${headBranch} @ ${headSha.substring(0, 8)} → ${triggerConclusion}`);

            // Hard fail: the workflow that fired this event didn't succeed.
            if (triggerConclusion !== 'success') {
              core.info(`Skipping: triggering run conclusion was '${triggerConclusion}'.`);
              core.setOutput('proceed', 'false');
              core.setOutput('branch', headBranch);
              return;
            }

            // Only main and develop are releasable.
            if (headBranch !== 'main' && headBranch !== 'develop') {
              core.info(`Skipping: branch '${headBranch}' is not main or develop.`);
              core.setOutput('proceed', 'false');
              core.setOutput('branch', headBranch);
              return;
            }

            // Find the most recent run of EACH required workflow for this SHA.
            // workflow_run.head_sha is the commit each workflow ran against.
            const requiredWorkflows = [
              { name: 'Main', id: 'main.yml' },
              { name: 'Emception CI/CD', id: 'emception.yml' },
            ];
            const statuses = {};

            for (const workflow of requiredWorkflows) {
              // List the latest runs of this workflow, filtered by head_sha.
              // GitHub returns up to 100 most recent; we scan for our SHA.
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflow.id,
                head_sha: headSha,
                per_page: 50,
              });

              const matching = runs.data.workflow_runs.filter(
                (r) => r.head_sha === headSha && r.event !== 'pull_request'
              );

              if (matching.length === 0) {
                core.info(`No run of '${workflow.name}' found for ${headSha.substring(0, 8)} yet.`);
                statuses[workflow.name] = 'missing';
                continue;
              }

              // Take the latest by created_at; if multiple runs (re-runs),
              // any conclusion='success' among them satisfies the gate.
              const anySuccess = matching.some((r) => r.conclusion === 'success');
              statuses[workflow.name] = anySuccess ? 'success' : matching[0].conclusion;
            }

            core.info(`Workflow statuses for ${headSha.substring(0, 8)}: ${JSON.stringify(statuses)}`);

            const allGreen = Object.values(statuses).every((s) => s === 'success');
            if (!allGreen) {
              core.info(`Skipping: not all required workflows are green for ${headSha.substring(0, 8)}.`);
              core.setOutput('proceed', 'false');
              core.setOutput('branch', headBranch);
              return;
            }

            core.info(`All required workflows green for ${headSha.substring(0, 8)} — proceeding.`);
            core.setOutput('proceed', 'true');
            core.setOutput('branch', headBranch);

  release:
    name: Auto-version and publish
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v4
        with:
          # changesets/action pushes commits back to the same branch.
          # Use a Personal Access Token with contents:write permission if
          # GITHUB_TOKEN's default trigger cannot re-run workflows on push.
          # For develop branch version-PRs, the default GITHUB_TOKEN is fine.
          fetch-depth: 0
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          # .npmrc above already sets this; belt-and-braces for `npm publish`.

      - name: Configure npm auth
        run: printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> ~/.npmrc

      - name: Install dependencies
        run: pnpm install --no-lockfile --ignore-scripts

      - name: Generate changeset from commits
        run: node scripts/devops/auto-changeset.mjs

      - name: No release-relevant commits?
        id: has-changeset
        run: |
          if ls .changeset/auto-*.md 2>/dev/null | grep -q .; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Generated changeset:"
            cat .changeset/auto-*.md
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "No release-relevant commits since last tag — nothing to release."
          fi

      - name: Create Release Pull Request or Publish
        if: steps.has-changeset.outputs.proceed == 'true'
        uses: changesets/action@v1 # v1
        with:
          publish: pnpm run release
          version: pnpm run version
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
