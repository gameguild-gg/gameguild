name: Credential step-up regression

on:
  pull_request:
    branches: [main, develop, "feature/**"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/api/Source/Modules/GameGuild.Identity.Authentication/**"
      - "apps/api/tests/GameGuild.Identity.Authentication.UnitTests/**"
      - "apps/api/tests/GameGuild.API.IntegrationTests/*StepUp*"
      - "packages/infrastructure/client/**"
      - "scripts/ci/credential-stepup-evidence.py"
      - "scripts/ci/credential-stepup-evidence.sh"
      - "scripts/ci/credential-evidence-requirements.txt"
      - "scripts/ci/tests/credential_stepup_evidence_test.py"
      - ".github/workflows/credential-stepup.yml"

permissions:
  contents: read

concurrency:
  group: credential-stepup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native:
    name: Credential native evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GAMEGUILD_TEST_POSTGRES_17_IMAGE: "mirror.gcr.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24"
      GAMEGUILD_TEST_POSTGRES_16_IMAGE: "mirror.gcr.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Prepare hardened XML evidence parser
        run: |
          python3 -m venv "$RUNNER_TEMP/credential-evidence-venv"
          "$RUNNER_TEMP/credential-evidence-venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r scripts/ci/credential-evidence-requirements.txt
          echo "CREDENTIAL_EVIDENCE_PYTHON=$RUNNER_TEMP/credential-evidence-venv/bin/python" >> "$GITHUB_ENV"
      - name: Verify evidence failure controls
        run: '"$CREDENTIAL_EVIDENCE_PYTHON" -B -m unittest discover -s scripts/ci/tests -p credential_stepup_evidence_test.py'
      - name: Build full solution and run credential regressions
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/credential-stepup-evidence.sh "$CANDIDATE_HEAD"
      - name: Preserve native results and actual Swagger
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: credential-stepup-${{ github.event.pull_request.head.sha }}
          path: artifacts/test-results/credential-stepup
          if-no-files-found: error
