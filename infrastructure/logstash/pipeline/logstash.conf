input {
  tcp {
    port => 5000
    codec => json_lines
    type => "serilog"
  }
  
  udp {
    port => 5000
    codec => json_lines
    type => "serilog"
  }
  
  beats {
    port => 5044
    type => "filebeat"
  }
}

filter {
  if [type] == "serilog" {
    # Parse Serilog structured logs
    if [SourceContext] {
      mutate {
        add_field => { "logger_name" => "%{SourceContext}" }
      }
    }
    
    # Extract correlation ID for request tracing
    if [CorrelationId] {
      mutate {
        add_field => { "correlation_id" => "%{CorrelationId}" }
      }
    }
    
    # Extract tenant context
    if [TenantId] {
      mutate {
        add_field => { "tenant_id" => "%{TenantId}" }
      }
    }
    
    # Extract user context
    if [UserId] {
      mutate {
        add_field => { "user_id" => "%{UserId}" }
      }
    }
    
    # Extract module information
    if [Module] {
      mutate {
        add_field => { "module" => "%{Module}" }
      }
    }
    
    # Extract component type
    if [ComponentType] {
      mutate {
        add_field => { "component_type" => "%{ComponentType}" }
      }
    }
    
    # Tag audit events
    if [EventType] == "AUDIT" {
      mutate {
        add_tag => ["audit"]
      }
    }
    
    # Tag performance events
    if [DurationMs] {
      mutate {
        add_tag => ["performance"]
        add_field => { "duration_ms" => "%{DurationMs}" }
      }
    }
    
    # Add timestamp
    date {
      match => ["@timestamp", "ISO8601"]
      target => "@timestamp"
    }
    
    # Add environment and service name
    mutate {
      add_field => {
        "service_name" => "gameguild-api"
        "service_version" => "${SERVICE_VERSION:1.0.0}"
        "environment" => "${ENVIRONMENT:development}"
      }
    }
  }
}

output {
  if [type] == "serilog" {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
      index => "gameguild-logs-%{+YYYY.MM.dd}"
      user => "${ELASTICSEARCH_USER:elastic}"
      password => "${ELASTICSEARCH_PASSWORD:changeme}"
    }
    
    # Separate index for audit logs
    if "audit" in [tags] {
      elasticsearch {
        hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
        index => "gameguild-audit-%{+YYYY.MM.dd}"
        user => "${ELASTICSEARCH_USER:elastic}"
        password => "${ELASTICSEARCH_PASSWORD:changeme}"
      }
    }
    
    # Separate index for performance metrics
    if "performance" in [tags] {
      elasticsearch {
        hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
        index => "gameguild-performance-%{+YYYY.MM.dd}"
        user => "${ELASTICSEARCH_USER:elastic}"
        password => "${ELASTICSEARCH_PASSWORD:changeme}"
      }
    }
  }
  
  # Debug output (optional, remove in production)
  if "${DEBUG_OUTPUT:false}" == "true" {
    stdout {
      codec => rubydebug
    }
  }
}
