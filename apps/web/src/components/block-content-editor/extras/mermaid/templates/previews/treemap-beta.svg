<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .placeholder-bg { fill: #f0f4f8; }
      .placeholder-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #64748b; }
      .placeholder-title { font-size: 18px; font-weight: 600; fill: #1e293b; }
      .rect-blue { fill: #3b82f6; opacity: 0.8; }
      .rect-cyan { fill: #06b6d4; opacity: 0.7; }
      .rect-violet { fill: #8b5cf6; opacity: 0.8; }
      .rect-green { fill: #10b981; opacity: 0.7; }
      .rect-label { font-size: 10px; fill: white; font-weight: bold; }
    </style>
  </defs>
  <rect class="placeholder-bg" width="400" height="300"/>
  <text x="200" y="20" text-anchor="middle" class="placeholder-title">Treemap Chart</text>
  
  <!-- Main rectangles representing hierarchy -->
  <rect class="rect-blue" x="20" y="50" width="140" height="120" rx="3"/>
  <text x="90" y="110" text-anchor="middle" class="rect-label">Development</text>
  <text x="90" y="125" text-anchor="middle" class="rect-label">(40%)</text>
  
  <rect class="rect-cyan" x="170" y="50" width="100" height="120" rx="3"/>
  <text x="220" y="110" text-anchor="middle" class="rect-label">Testing</text>
  <text x="220" y="125" text-anchor="middle" class="rect-label">(30%)</text>
  
  <rect class="rect-violet" x="280" y="50" width="100" height="120" rx="3"/>
  <text x="330" y="110" text-anchor="middle" class="rect-label">Docs</text>
  <text x="330" y="125" text-anchor="middle" class="rect-label">(20%)</text>
  
  <!-- Sub-rectangles -->
  <rect class="rect-green" x="20" y="180" width="70" height="90" rx="2"/>
  <text x="55" y="222" text-anchor="middle" class="rect-label">Frontend</text>
  
  <rect class="rect-green" x="100" y="180" width="60" height="90" rx="2" opacity="0.6"/>
  <text x="130" y="222" text-anchor="middle" class="rect-label">Backend</text>
  
  <rect class="rect-green" x="170" y="180" width="100" height="90" rx="2"/>
  <text x="220" y="222" text-anchor="middle" class="rect-label">Infrastructure</text>
  
  <rect class="rect-green" x="280" y="180" width="100" height="90" rx="2" opacity="0.6"/>
  <text x="330" y="222" text-anchor="middle" class="rect-label">Operations</text>
</svg>
